name: Verify iPhone build
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select iOS 26 toolchain
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - run: swift test
      - name: Build iPhone and widget
        run: xcodebuild -quiet -project Parkify.xcodeproj -scheme Parkify -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/device" CODE_SIGNING_ALLOWED=NO build
      - name: Launch on simulator
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys;print(next(r["identifier"] for r in reversed(json.load(sys.stdin)["runtimes"]) if r["isAvailable"] and r["identifier"].split(".")[-1].startswith("iOS-26-")))')"
          phone="$(xcrun simctl create "Parkify iPhone 14 Pro" com.apple.CoreSimulator.SimDeviceType.iPhone-14-Pro "$runtime")"
          xcrun simctl boot "$phone"
          xcodebuild -quiet -project Parkify.xcodeproj -scheme Parkify -configuration Debug -destination "id=$phone" -derivedDataPath "$RUNNER_TEMP/sim" CODE_SIGNING_ALLOWED=NO build
          xcrun simctl bootstatus "$phone" -b
          xcrun simctl install "$phone" "$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/Parkify.app"
          xcrun simctl privacy "$phone" grant location com.danogutierrez.parkify
          xcrun simctl location "$phone" set 37.3317,-122.0301
          xcrun simctl launch "$phone" com.danogutierrez.parkify
          sleep 8
          xcrun simctl io "$phone" screenshot "$RUNNER_TEMP/parkify.png"
          container="$(xcrun simctl get_app_container "$phone" com.danogutierrez.parkify data)"
          database="$container/Library/Application Support/City/city.sqlite"
          for attempt in {1..60}; do
            if test -s "$database"; then break; fi
            sleep 2
          done
          test -s "$database"
          sqlite3 -readonly "$database" "select 'Downloaded curb segments', count(*) from zone; select name,value from meta;"
          xcodebuild test -project Parkify.xcodeproj -scheme Parkify -destination "id=$phone" -derivedDataPath "$RUNNER_TEMP/sim" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/parking-tests.xcresult"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Parkify-simulator-preview
          path: |
            ${{ runner.temp }}/parkify.png
            ${{ runner.temp }}/parking-tests.xcresult
