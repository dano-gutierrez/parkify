name: Publish city data
on:
  workflow_dispatch:
    inputs:
      mirror_latest:
        description: Publish the existing validated release to Supabase
        type: boolean
        default: false
  schedule:
    - cron: '37 11 * * *'
permissions:
  contents: write
  id-token: write
concurrency:
  group: parkify-city-publisher
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ !inputs.mirror_latest }}
        run: python3 Data/build.py "$RUNNER_TEMP/curbs"
      - if: ${{ !inputs.mirror_latest }}
        run: python3 Data/publish.py "$RUNNER_TEMP/curbs"
      - name: Publish to Bucketlist Storage
        run: |
          if [[ "${{ inputs.mirror_latest }}" != "true" ]]; then
            export RELEASE_TAG="city-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          python3 Data/mirror.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validated-city-release
          path: |
            ${{ runner.temp }}/curbs/manifest.json
            ${{ runner.temp }}/curbs/*.gzpart
          if-no-files-found: ignore
          retention-days: 1
